name: Deploy Pages

on:
  workflow_run:
    workflows: ['Update data']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Stays off until Pages is enabled and the repo variable PAGES_ENABLED is set to 'true'.
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get the latest data from the update run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: craft-watch-data
          path: data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the data artifact is there
        run: |
          test -s data/apps.json || { echo "data/apps.json missing: the update run did not provide it"; exit 1; }

      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          cp data/apps.json _site/data/
          if [ -f data/files.json ]; then cp data/files.json _site/data/; fi
          if [ -f data/unofficial.json ]; then cp data/unofficial.json _site/data/; fi
          if [ -d data/history ]; then cp -R data/history _site/data/; fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
