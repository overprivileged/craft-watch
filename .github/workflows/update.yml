name: Update data

on:
  # Asks for a run every 15 minutes, off the busy :00/:15 marks (GitHub may still delay scheduled runs by hours).
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # Checks whether saved state exists. With no state, the collect job gets 25 minutes for the full first fetch (12 otherwise, room for the backfill).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cold: ${{ steps.state.outputs.cache-matched-key == '' }}
    steps:
      # cache-matched-key also matches the prefix; cache-hit would be false on every run (the key is unique per run).
      - id: state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/state.json
          key: state-v3-${{ github.run_id }}
          restore-keys: state-v3-
          lookup-only: true

      - name: Say which state this run uses
        run: |
          echo "Saved state: ${{ steps.state.outputs.cache-matched-key || 'none, first full fetch (25 min limit)' }}"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.cold == 'true' && 25 || 12 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # Saved state from the previous run: the collector fetches only what changed since then.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/state.json
          key: state-v3-${{ github.run_id }}
          restore-keys: state-v3-

      - name: Collect public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && hashFiles('data/state.json') != ''
        with:
          path: data/state.json
          key: state-v3-${{ github.run_id }}

      # The site gets this data through an artifact, not a commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: craft-watch-data
          path: |
            data/apps.json
            data/files.json
          retention-days: 2

      - name: Commit the daily history file (only when it is new)
        run: |
          if [ -n "$(git status --porcelain data/history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history
            git commit -m "Daily snapshot $(date -u +%F)"
            git pull --rebase --quiet
            git push --quiet
          else
            echo "No new history file today."
          fi
